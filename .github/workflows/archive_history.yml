name: archive_history

# Fill price history backwards (newest window first, today -> 2018) in 10-day windows:
# ingest the window from Resource 2, export each day to R2 as Parquet, verify the upload,
# delete the window from the warehouse, repeat. Resumes from archive_state, so a stopped or failed
# run just continues. Does nothing until the MANDI_R2_* secrets exist.
# Each run that finishes a window starts the next run itself, so the loop continues until 2018
# without waiting for the schedule. The schedule is a backstop in case a chained run fails.
on:
  schedule:
    - cron: "20 */3 * * *" # backstop; one window per run (about 40 min)
  workflow_dispatch:
    inputs:
      max_windows:
        description: "Stop after this many windows (blank = one window per run)"
        required: false

concurrency:
  group: warehouse-writer
  cancel-in-progress: false # a cancelled run would leave a half-ingested window and a RUNNING batch

permissions:
  contents: read
  actions: write # lets a finished run start the next one

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Archive history
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          HISTORY_SUPABASE_URL: ${{ secrets.HISTORY_SUPABASE_URL }}
          HISTORY_SUPABASE_SERVICE_KEY: ${{ secrets.HISTORY_SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MANDI_R2_ACCOUNT_ID: ${{ secrets.MANDI_R2_ACCOUNT_ID }}
          MANDI_R2_ACCESS_KEY_ID: ${{ secrets.MANDI_R2_ACCESS_KEY_ID }}
          MANDI_R2_SECRET_ACCESS_KEY: ${{ secrets.MANDI_R2_SECRET_ACCESS_KEY }}
          MANDI_R2_BUCKET: ${{ secrets.MANDI_R2_BUCKET }}
        run: |
          set -o pipefail
          args="--budget-minutes 300 --max-windows 1"
          if [ -n "${{ github.event.inputs.max_windows }}" ]; then args="$args --max-windows ${{ github.event.inputs.max_windows }}"; fi
          python -m farmuncle_pipeline.ingestion.archive_history $args | tee history.log
          if grep -qE "windows completed this run: [1-9]" history.log; then
            gh workflow run archive_history.yml --ref main
            echo "next window started"
          else
            echo "no window finished; loop stops here (done, or waiting on the feed)"
          fi
