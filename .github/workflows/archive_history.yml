name: archive_history

# Fill price history backwards (newest window first, today -> Nov 2016) in 10-day windows:
# ingest the window from Resource 2, export each day to R2 as Parquet, verify the upload,
# delete the window from the warehouse, repeat. Resumes from archive_state, so a stopped or failed
# run just continues. Does nothing until the MANDI_R2_* secrets exist.
# Each run that finishes a window starts the next run itself, so the loop continues until Nov 2016
# without waiting for the schedule. The schedule is a backstop in case a chained run fails.
on:
  schedule:
    # backstop; one window per run (about 40 min). Skips 21:20 UTC so it never queues behind (and so cancels) the nightly
    # job: GitHub keeps one waiting run per concurrency group and drops the older one.
    - cron: "20 0-18/3 * * *"
  workflow_dispatch:
    inputs:
      max_windows:
        description: "Stop after this many windows (blank = one window per run)"
        required: false

concurrency:
  group: warehouse-writer
  cancel-in-progress: false # a cancelled run would leave a half-ingested window and a RUNNING batch

permissions:
  contents: read
  actions: write # lets a finished run start the next one

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Archive history
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          HISTORY_SUPABASE_URL: ${{ secrets.HISTORY_SUPABASE_URL }}
          HISTORY_SUPABASE_SERVICE_KEY: ${{ secrets.HISTORY_SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MANDI_R2_ACCOUNT_ID: ${{ secrets.MANDI_R2_ACCOUNT_ID }}
          MANDI_R2_ACCESS_KEY_ID: ${{ secrets.MANDI_R2_ACCESS_KEY_ID }}
          MANDI_R2_SECRET_ACCESS_KEY: ${{ secrets.MANDI_R2_SECRET_ACCESS_KEY }}
          MANDI_R2_BUCKET: ${{ secrets.MANDI_R2_BUCKET }}
        run: |
          set -o pipefail
          args="--budget-minutes 300 --max-windows 1"
          if [ -n "${{ github.event.inputs.max_windows }}" ]; then args="$args --max-windows ${{ github.event.inputs.max_windows }}"; fi
          python -m farmuncle_pipeline.ingestion.archive_history $args | tee history.log
          # The nightly job (20:45 UTC) shares this concurrency group. Starting the next window while it waits
          # would cancel it, and then publish_analytics never runs. So until it has succeeded since its last slot, hand over.
          slot=$(date -u -d "$([ "$(date -u +%H%M)" -ge 2045 ] && echo today || echo yesterday) 20:45" +%Y-%m-%dT%H:%M:%SZ)
          aged=$(gh run list --workflow nightly.yml -L 10 --json createdAt,status,conclusion --jq "[.[] | select(.createdAt >= \"$slot\")] | if any(.conclusion == \"success\") then \"done\" elif any(.status != \"completed\") then \"waiting\" else \"missing\" end")
          if [ "$aged" != "done" ]; then
            if [ "$aged" = "missing" ]; then gh workflow run nightly.yml --ref main; fi
            echo "nightly has not finished since $slot ($aged); it goes first, the backstop schedule resumes the backfill"
          elif grep -qE "windows completed this run: [1-9]" history.log; then
            # GitHub's dispatch API sometimes answers 500; one failed call stopped the chain for hours (4 Nov), so try a few times.
            for wait in 0 15 60 180; do sleep $wait; gh workflow run archive_history.yml --ref main && break; done
            echo "next window started"
          else
            echo "no window finished; loop stops here (done, or waiting on the feed)"
          fi
