name: archive_range

# One-off: move a range of FINAL days from the warehouse to R2, verify each upload, then delete the day.
# Manual only. Days that are not FINAL are skipped.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day, YYYY-MM-DD"
        required: true
      end:
        description: "Last day, YYYY-MM-DD"
        required: true

concurrency:
  group: warehouse-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Archive range
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          HISTORY_SUPABASE_URL: ${{ secrets.HISTORY_SUPABASE_URL }}
          HISTORY_SUPABASE_SERVICE_KEY: ${{ secrets.HISTORY_SUPABASE_SERVICE_KEY }}
          MANDI_R2_ACCOUNT_ID: ${{ secrets.MANDI_R2_ACCOUNT_ID }}
          MANDI_R2_ACCESS_KEY_ID: ${{ secrets.MANDI_R2_ACCESS_KEY_ID }}
          MANDI_R2_SECRET_ACCESS_KEY: ${{ secrets.MANDI_R2_SECRET_ACCESS_KEY }}
          MANDI_R2_BUCKET: ${{ secrets.MANDI_R2_BUCKET }}
        run: python -m farmuncle_pipeline.ingestion.archive_range --start "${{ github.event.inputs.start }}" --end "${{ github.event.inputs.end }}"
