name: live_tick

# Resource 1, today-only, hourly (Master Build Spec §9/§21 Step 14).
on:
  schedule:
    # UTC. Hourly at :05 (off the top of the hour, when GitHub schedules are busiest).
    - cron: "5 * * * *"
  workflow_dispatch: {} # manual trigger, for testing/ops

permissions:
  contents: read
  actions: write # the chain job starts the next hourly run

  # Do NOT cancel an in-progress run: a cancelled run is SIGKILLed before
  # its own except-block can close ingestion_batches out of RUNNING,
  # which would leave a stale row blocking every future run via the §12
  # concurrency guard. Queuing (not cancelling) is the safe choice —
  # by the time a queued run starts, the prior one has already closed
  # its batch, so there's no conflict left to hit anyway.
jobs:
  run:
    concurrency:
      group: live-tick
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30 # §24 target is <5 min; generous margin before treating it as hung
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run live_tick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          HISTORY_SUPABASE_URL: ${{ secrets.HISTORY_SUPABASE_URL }}
          HISTORY_SUPABASE_SERVICE_KEY: ${{ secrets.HISTORY_SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m farmuncle_pipeline.ingestion.live_tick

  # GitHub's cron skipped many hourly runs, so each run also starts the next one at the coming :05 UTC.
  # The cron above stays as a backup; if two chains exist, the older one sees a newer run and stops.
  chain:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for the next :05 and start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          now=$(date +%s)
          next=$(( (now / 3600) * 3600 + 300 ))
          if [ "$next" -le "$now" ]; then next=$(( next + 3600 )); fi
          sleep $(( next - now ))
          mine=$(gh run view "${{ github.run_id }}" --json createdAt --jq .createdAt)
          newer=$(gh run list --workflow live_tick.yml --limit 20 --json databaseId,createdAt,status             --jq "[.[] | select(.createdAt > \"$mine\" and .status != \"completed\")] | length")
          if [ "$newer" = "0" ]; then gh workflow run live_tick.yml --ref main; else echo "a newer run exists; chain ends here"; fi
