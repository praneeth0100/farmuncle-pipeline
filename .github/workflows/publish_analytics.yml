name: publish_analytics

# Chart files and change stats for the app, from the R2 archive plus the warehouse. Reads only.
# Runs nightly as a step of nightly.yml; this workflow is for running it alone by hand.
on:
  workflow_dispatch: {}

concurrency:
  group: publish-analytics
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Publish analytics files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MANDI_R2_ACCOUNT_ID: ${{ secrets.MANDI_R2_ACCOUNT_ID }}
          MANDI_R2_ACCESS_KEY_ID: ${{ secrets.MANDI_R2_ACCESS_KEY_ID }}
          MANDI_R2_SECRET_ACCESS_KEY: ${{ secrets.MANDI_R2_SECRET_ACCESS_KEY }}
          MANDI_R2_BUCKET: ${{ secrets.MANDI_R2_BUCKET }}
        run: python -m farmuncle_pipeline.ingestion.publish_analytics
