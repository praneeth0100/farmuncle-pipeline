# Publisher feeds for the News tab (see docs/news.md). To drop a feed, delete its entry.
# states/districts are codes from catalog/mandis.json. farm_only: an agriculture section, every item kept;
# other feeds keep only items with a farm word. upgrade_images: the feed lists http:// pictures its host also serves over https.
# Checked 6 Nov 2026. Tried and left out: Amar Ujala state feeds (no pictures), Patrika (server error 522),
