# Place names in regional scripts, so a story in that language gets its district and state codes (see docs/news.md).
# Code → names. Matched anywhere in the text because words inflect at the end (కర్నూలులో), so use stems, and avoid names
# that are also everyday words or people (కృష్ణ, ప్రకాశం and అన్నమయ్య only with జిల్లా, "district").
# The catalog spells some districts twice (ap.anantapur, ap.ananthapuramu): both codes carry the same names, so readers on
# either get the story.
